    <main>
        <section class="contact-section">
            <h1 class="page-title">Contact</h1>
            <!-- This contact section is styled using Bootstrap and custome CSS -->
            <!-- The contact form is displayed in a responsive div -->
            <!-- The form is wrapped in a responsive div to allow it to shrink on mobile devices -->
            <form id="contactForm" action="#" method="POST" novalidate>
                <fieldset>
                <legend>Contact Information</legend>
                    
                <div class="d-flex flex-column flex-md-row align-items-center justify-content-center w-100 mb-3 gap-3">
                    <label for="fname" class="form-label">First Name:</label>
                    <input type="text" id="fname" name="fname" class="form-control" required placeholder="Enter your first name">
                </div>

                <div class="d-flex flex-column flex-md-row align-items-center justify-content-center w-100 mb-3 gap-3">
                    <label for="lname" class="form-label">Last Name:</label>
                    <input type="text" id="lname" name="lname" class="form-control" required placeholder="Enter your last name">
                </div>

                <div class="d-flex flex-column flex-md-row align-items-center justify-content-center w-100 mb-3 gap-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" id="email" name="email" class="form-control" required placeholder="name@domain.com">
                </div>

                <div class="d-flex flex-column flex-md-row align-items-center justify-content-center w-100 mb-3 gap-3">
                    <label for="meet" class="form-label">Have we met before?</label>
                    <select name="meet" id="meet" class="form-select">
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>

                <div class="d-flex flex-column flex-md-row align-items-center justify-content-center w-100 mb-3 gap-3">
                    <label for="date" class="form-label">Date:</label>
                    <input class="form-control date" type="date" id="date" name="date" required>
                </div>

                <div class="d-flex flex-column flex-md-row align-items-center justify-content-center w-100 mb-3 gap-3">
                    <label for="message" class="form-label">Message:</label>
                    <textarea id="message" name="message" class="form-control" rows="4" required></textarea>
                </div>

                <button class="btn mt-3" type="submit">Send</button>
                <div id="formMessages" class="mt-3 w-100 text-center"></div>
                <small class="mt-3"><i>This form is for communication purposes only.I do not store any personal information.</i></small>
            </fieldset>
        </form>
        </section>
    </main>
